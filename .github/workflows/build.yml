name: Build Sakura Visuals
on:
  push:
    branches: ["sakura-visuals-build"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build mod
        run: gradle build --no-daemon --stacktrace
      - name: Verify JAR
        run: |
          python3 - <<'PY'
          import glob, zipfile, json
          jars=[p for p in glob.glob('build/libs/*.jar') if '-sources' not in p]
          assert jars, 'No mod jar produced'
          jar=jars[0]
          with zipfile.ZipFile(jar) as z:
            assert 'me/sakuravisuals/client/SakuraVisualsClient.class' in z.namelist()
            meta=json.loads(z.read('fabric.mod.json'))
            assert meta['id']=='sakuravisuals'
          print(jar)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SakuraVisuals-1.21.11-Fabric
          path: build/libs/*.jar
          if-no-files-found: error
