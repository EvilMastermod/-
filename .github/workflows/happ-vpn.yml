name: Update Happ free proxy list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/happ-vpn.yml'
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout subscription branch
        uses: actions/checkout@v4
        with:
          ref: happ-vpn
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current publicly shared nodes
        run: python happ/update_happ.py
      - name: Publish subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add happ/subscription.txt happ/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Happ free proxy subscription"
            git push origin HEAD:happ-vpn
          fi
