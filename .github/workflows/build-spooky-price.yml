name: Build Spooky Price Collector

on:
  push:
    paths:
      - 'spooky-price-mod/**'
      - '.github/workflows/build-spooky-price.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle -p spooky-price-mod build --no-daemon --stacktrace
      - name: Verify compiled JAR
        run: |
          python3 - <<'PY'
          import zipfile,json
          p='spooky-price-mod/build/libs/SpookyPriceCollector-1.21.11-Fabric-1.0.0.jar'
          with zipfile.ZipFile(p) as z:
              assert 'ua/kostia/spookyprice/SpookyPriceClient.class' in z.namelist()
              assert json.loads(z.read('fabric.mod.json'))['id']=='spookyprice'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SpookyPriceCollector-1.21.11-Fabric
          path: spooky-price-mod/build/libs/SpookyPriceCollector-1.21.11-Fabric-1.0.0.jar
          if-no-files-found: error
