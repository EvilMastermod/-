name: Build Pitbike Stunt (Fabric 1.21.11)

on:
  push:
    branches: [pitbike-stunt-1.21.11]
    paths:
      - 'pitbike-stunt/**'
      - '.github/workflows/pitbike-stunt.yml'
  workflow_dispatch:

concurrency:
  group: pitbike-stunt-1.21.11
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unpack Pitbike Stunt source
        shell: bash
        run: |
          base64 -d pitbike-stunt/source-0.2.0-alpha.zip.b64 > /tmp/pitbike-source.zip
          echo "c247abecc8c50fb7602d2ea9bc8c4a54741274cb785d787b665f35a4acc288fb  /tmp/pitbike-source.zip" | sha256sum --check
          mkdir -p project
          unzip -q /tmp/pitbike-source.zip -d project
      - name: Migrate source to Minecraft 1.21.11
        run: python3 pitbike-stunt/migrate-to-1.21.11.py
      - name: Port riding and rendering to Minecraft 1.21.11
        shell: bash
        run: |
          set -o pipefail
          python3 pitbike-stunt/port-gameplay-12111.py 2>&1 | tee port-12111.log
      - name: Replace bulky left HUD with compact speed overlay
        run: python3 pitbike-stunt/replace-hud-12111.py
      - name: Increase motorcycle top speeds and verify forward throttle
        shell: bash
        run: python3 pitbike-stunt/increase-speed-12111.py
      - name: Fix Minecraft 1.21.11 bike item registry keys
        run: python3 pitbike-stunt/fix-item-registry-12111.py
      - name: Install exact donor model and steering fixes
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee donor-install.log) 2>&1
          # Reconstruct the exact user-owned binary model from six GitHub text assets.
          cat pitbike-stunt/donor-parts/part-*.b64 | base64 --decode > /tmp/pitbike-donor-kit.zip
          echo '487d87e201736c99018439fd16c6d8c7c7527e36529b6fa7c44bdc7c2a7059be  /tmp/pitbike-donor-kit.zip' | sha256sum --check
          mkdir -p donor-unpacked
          unzip -q /tmp/pitbike-donor-kit.zip -d donor-unpacked
          python3 donor-unpacked/scripts/install_exact_donor.py
      - name: Install motor sound encoder
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Repair engine audio, steering, suspension and rider pose
        shell: bash
        run: |
          set -o pipefail
          python3 pitbike-stunt/fix-riding-audio-12111.py 2>&1 | tee riding-hotfix.log
      - name: Fix wheelie contact, suspension and rider interpolation
        shell: bash
        run: |
          set -euo pipefail
          python3 pitbike-stunt/fix-rider-wheels-smooth-12111.py 2>&1 | tee final-physics-fix.log
      - name: Fix seating, head-only movement, floating skin and smooth driving
        shell: bash
        run: |
          set -euo pipefail
          python3 pitbike-stunt/fix-seat-head-skin-smoothing-12111.py 2>&1 | tee seat-head-fix.log
      - name: Build Minecraft mod
        id: compilation
        continue-on-error: true
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace 2>&1 | tee ../pitbike-build.log
      - name: Save compiled mod or error log to separate branch
        if: always()
        shell: bash
        run: |
          mkdir -p build-output/1.21.11
          if [ -f pitbike-build.log ]; then cp pitbike-build.log build-output/1.21.11/build-log.txt; fi
          if [ -f port-12111.log ]; then cp port-12111.log build-output/1.21.11/port-log.txt; fi
          if [ -f seat-head-fix.log ]; then cp seat-head-fix.log build-output/1.21.11/seat-head-fix-log.txt; fi
          if [ -f final-physics-fix.log ]; then cp final-physics-fix.log build-output/1.21.11/final-physics-fix-log.txt; fi
          if [ -f donor-install.log ]; then cp donor-install.log build-output/1.21.11/donor-install-log.txt; fi
          if [ -f riding-hotfix.log ]; then cp riding-hotfix.log build-output/1.21.11/riding-hotfix-log.txt; fi
          if [ "${{ steps.compilation.outcome }}" = 'success' ] && [ -f project/build/libs/pitbike-stunt-1.21.11-0.3.0-alpha.jar ]; then
            cp project/build/libs/pitbike-stunt-1.21.11-0.3.0-alpha.jar build-output/1.21.11/PitbikeStunt-1.21.11.jar
            echo 'SUCCESS' > build-output/1.21.11/status.txt
          else
            echo 'FAILED' > build-output/1.21.11/status.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build-output
          git commit -m 'Publish Pitbike Stunt build result [skip ci]' || exit 0
          git push origin HEAD:pitbike-stunt-1.21.11
      - name: Upload compiled mod
        if: steps.compilation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PitbikeStunt-1.21.11-jar
          path: project/build/libs/pitbike-stunt-1.21.11-0.3.0-alpha.jar
          if-no-files-found: error
      - name: Mark compilation errors as failed
        if: steps.compilation.outcome != 'success'
        run: exit 1
