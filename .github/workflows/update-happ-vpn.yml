name: Refresh Happ VPN nodes

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh country server pools
        run: python vpn/update_happ.py
      - name: Commit updated subscription
        run: |
          if ! git diff --quiet -- vpn/Happ_US_RU_Auto.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vpn/Happ_US_RU_Auto.json
            git commit -m "Refresh Happ US and RU public proxies"
            git push
          fi
