name: Happ VPN 2.0 - health checks and fast nodes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "vpn/refresh_fast.py"
      - ".github/workflows/update-happ-vpn.yml"

permissions:
  contents: write

concurrency:
  group: happ-vpn-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Xray
        run: |
          curl -fLsS --retry 2 -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -j /tmp/xray.zip xray geoip.dat geosite.dat -d .
          chmod +x xray
      - name: Verify country and select fastest working nodes
        run: python vpn/refresh_fast.py
      - name: Verify all generated Xray profiles start
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          profiles = json.loads(pathlib.Path("vpn/Happ_US_RU_Auto.json").read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory() as d:
              for i, profile in enumerate(profiles):
                  p = pathlib.Path(d) / f"profile_{i}.json"
                  p.write_text(json.dumps(profile, ensure_ascii=False), encoding="utf-8")
                  test = subprocess.run(["./xray", "run", "-test", "-config", str(p)],
                                        capture_output=True, text=True, env=dict(os.environ, XRAY_LOCATION_ASSET="."))
                  if test.returncode:
                      raise RuntimeError(f"{profile.get('remarks')} : {test.stderr[-800:]}")
          print(f"Validated {len(profiles)} profiles in Xray")
          PY
      - name: Publish Happ subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the freshly generated, Xray-validated files when main has moved
          # during the check. Mixed reset updates index/HEAD, not the generated files.
          git fetch origin main
          git reset --mixed origin/main
          git add vpn/Happ_US_RU_Auto.json vpn/FAST_NODES_RESULTS.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified Happ global and country proxy pools"
            git push origin HEAD:main
          fi
