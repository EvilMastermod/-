name: Build Shadow NPC

on:
  push:
    branches:
      - shadow-npc-build
    paths:
      - 'shadow-npc/**'
      - '.github/workflows/build-shadow-npc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle -p shadow-npc clean build --no-daemon --stacktrace
      - name: Verify JAR
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          jars=[p for p in glob.glob('shadow-npc/build/libs/*.jar') if '-sources' not in p]
          assert len(jars)==1, jars
          p=jars[0]
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert 'com/rnmd/shadownpc/ShadowNpcMod.class' in names
              assert 'com/rnmd/shadownpc/client/ShadowNpcClient.class' in names
              assert 'com/rnmd/shadownpc/client/screen/NpcEditorScreen.class' in names
              assert 'assets/shadow_npc/textures/item/npc_staff.png' in names
              assert json.loads(z.read('fabric.mod.json'))['id']=='shadow_npc'
          print(p)
          PY
      - name: Launch client smoke test
        run: |
          mkdir -p shadow-npc/run
          printf 'onboardAccessibility:false\n' > shadow-npc/run/options.txt
          timeout 300s xvfb-run -a gradle -p shadow-npc runClient --no-daemon > shadow-npc/smoke.log 2>&1 || true
          grep SHADOW_NPC_CLIENT_OK shadow-npc/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShadowNPC-build-logs
          path: |
            shadow-npc/smoke.log
            shadow-npc/run/logs/latest.log
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowNPC-Fabric-1.21.11
          path: shadow-npc/build/libs/ShadowNPC-Fabric-1.21.11-0.2.0.jar
          if-no-files-found: error
